# Emails the repo owner (through an assigned GitHub issue) when the page fails to build
# or when yesterday's data (US Eastern) has not arrived by early afternoon. See feed/alert.py.
name: Feed checks
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *"   # 14:00 EST / 15:00 EDT
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: feed-checks-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the page the same way Vercel does
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          sh feed/vercel-build.sh 2>&1 | tee build.log
      - name: Open or close the build alert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 feed/alert.py build ${{ steps.build.outcome }} build.log
  fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that yesterday's data arrived
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # On push this only closes an open late-data alert once that day has arrived.
        run: python3 feed/alert.py fresh ${{ github.event_name == 'push' && '--close-only' || '' }}

<style>
:root {
  --bg: #ffffff;
  --side: #f3f3f5;
  --list: #ffffff;
  --ink: #1d1d1f;
  --ink-2: #48484d;
  --muted: #86868b;
  --line: #e5e5ea;
  --line-2: #d1d1d6;
  --hover: rgba(0,0,0,.04);
  --sel: #0a66e4;
  --sel-ink: #ffffff;
  --sel-soft: rgba(10,102,228,.12);
  --chip: #f2f2f4;
  --high: #d13b2a;  --high-bg: #fdecea;
  --mid: #b86e00;   --mid-bg: #fdf2e0;
  --low: #6b6e75;   --low-bg: #efeff1;
  --refund: #3b55d9; --refund-bg: #eceffd;
  --info: #1b7f72;  --info-bg: #e5f4f1;
  --unread: #0a66e4;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1e20;
    --side: #262628;
    --list: #1e1e20;
    --ink: #f2f2f4;
    --ink-2: #c4c4c8;
    --muted: #8e8e93;
    --line: #333336;
    --line-2: #444448;
    --hover: rgba(255,255,255,.05);
    --sel: #2f7cf0;
    --sel-soft: rgba(47,124,240,.22);
    --chip: #2c2c2f;
    --high: #ff7a68;  --high-bg: #3d1f1b;
    --mid: #f2b350;   --mid-bg: #3a2c14;
    --low: #a3a3a8;   --low-bg: #2c2c2f;
    --refund: #93a6ff; --refund-bg: #232947;
    --info: #6fcfc0;  --info-bg: #17322e;
    --unread: #4f93ff;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--sel); text-decoration: none; overflow-wrap: anywhere; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; border-radius: 6px; }
code { font-family: var(--mono); font-size: .88em; background: var(--chip); padding: 1px 5px; border-radius: 5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; display: grid; grid-template-columns: 248px 372px minmax(0, 1fr); }
.pane { min-height: 0; display: flex; flex-direction: column; min-width: 0; }
.scroll { overflow: auto; min-height: 0; flex: 1; overscroll-behavior: contain; }

/* ---------- sidebar ---------- */
.side { background: var(--side); border-right: 1px solid var(--line); }
.side-top { display: flex; align-items: center; gap: 8px; padding: 14px 14px 8px; min-height: 52px; }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.side-top b { font-size: 14px; font-weight: 700; line-height: 1.2; }
.side-top small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; }
.group { padding: 6px 8px 10px; }
.group h3 { margin: 6px 8px 4px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; display: flex; justify-content: space-between; align-items: center; }
.group h3 span { font-weight: 500; }
.nav { width: 100%; display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border-radius: 7px; text-align: left; color: var(--ink); }
.nav:hover { background: var(--hover); }
.nav[aria-current="true"] { background: var(--sel-soft); }
.nav .ico { width: 18px; height: 18px; display: grid; place-items: center; flex: none; color: var(--sel); }
.nav .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .cnt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.nav .score { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 26px; text-align: center; padding: 1px 0; border-radius: 5px; }
.av { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; flex: none; }
.side-foot { padding: 10px 16px 14px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); line-height: 1.6; }

/* ---------- list ---------- */
.list { background: var(--list); border-right: 1px solid var(--line); }
.list-top { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.lt-row { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.lt-title { flex: 1; min-width: 0; }
.lt-title b { display: block; font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.25; }
.lt-title small { color: var(--muted); font-size: 12px; }
.search { position: relative; }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); padding: 0 10px 0 28px; outline: none; font-size: 13px; }
.search input:focus { border-color: var(--sel); background: var(--bg); }
.tbtn { width: 30px; height: 30px; border-radius: 7px; display: inline-grid; place-items: center; color: var(--ink-2); flex: none; }
.tbtn:hover { background: var(--hover); }
.tbtn[aria-pressed="true"] { color: var(--sel); }
.tbtn:disabled { opacity: .3; cursor: default; }
.back { display: none; }
.dayhead { position: sticky; top: 0; z-index: 1; background: color-mix(in srgb, var(--list) 94%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); padding: 8px 16px 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.dayhead span { color: var(--muted); font-weight: 500; }
.item { position: relative; width: 100%; text-align: left; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; padding: 10px 14px 10px 20px; border-bottom: 1px solid var(--line); }
.item:hover { background: var(--hover); }
.item .dot { position: absolute; left: 7px; top: 17px; width: 8px; height: 8px; border-radius: 50%; background: var(--unread); }
.item .star { position: absolute; left: 5px; top: 30px; color: #e8a400; }
.item .big { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 17px; }
.item h4 { margin: 0; font-size: 14px; font-weight: 650; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .src { display: flex; justify-content: space-between; gap: 8px; margin-top: 3px; font-size: 12px; color: var(--muted); }
.item .src b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.item .tags { display: inline-flex; gap: 4px; margin-right: 6px; vertical-align: 1px; }
.item.read h4 { font-weight: 500; color: var(--ink-2); }
.item[aria-selected="true"] { background: var(--sel); color: var(--sel-ink); border-bottom-color: transparent; border-radius: 10px; margin: 2px 6px; width: calc(100% - 12px); padding-left: 14px; }
.item[aria-selected="true"] p, .item[aria-selected="true"] .src, .item[aria-selected="true"] .src b, .item[aria-selected="true"] h4 { color: var(--sel-ink); }
.item[aria-selected="true"] .dot { background: #fff; left: 3px; }
.item[aria-selected="true"] .tag { background: rgba(255,255,255,.22); color: #fff; }
.item.brief .big { background: var(--ink); color: var(--bg); }
.empty { padding: 40px 20px; color: var(--muted); text-align: center; }
.seg { display: flex; background: var(--chip); border-radius: 8px; padding: 2px; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; height: 26px; padding: 0 9px; border-radius: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.seg button .c { color: var(--muted); margin-left: 3px; font-size: 11px; }
.rk { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; background: var(--chip); color: var(--ink-2); }
.rk.top { background: var(--ink); color: var(--bg); }
.rk-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.rk-top b { font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.amt { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.01em; }
.amt small { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.sbar { height: 6px; border-radius: 6px; background: var(--chip); overflow: hidden; margin: 6px 0 2px; }
.sbar i { display: block; height: 100%; border-radius: 6px; }
.sbar i.high { background: var(--high); } .sbar i.mid { background: var(--mid); } .sbar i.low { background: var(--low); }
.item[aria-selected="true"] .rk { background: rgba(255,255,255,.22); color: #fff; }
.item[aria-selected="true"] .amt small, .item[aria-selected="true"] .lvl { color: #fff; }
.item[aria-selected="true"] .sbar { background: rgba(255,255,255,.25); }
.item[aria-selected="true"] .sbar i { background: #fff; }
.rank-note { padding: 10px 16px; font-size: 12px; color: var(--muted); line-height: 1.6; border-bottom: 1px solid var(--line); }
.subhead { padding: 8px 16px 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); border-bottom: 1px solid var(--line); background: var(--chip); }
.ptable .pr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: baseline; }
.ptable .pr:first-child { border-top: 0; }
.ptable .pr b { font-weight: 650; }
.ptable .pr .amt { font-size: 15px; }
.ptable .pr .d { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.ptable .pr .d button { color: var(--sel); font-size: 12px; }
.hsub { margin: 16px 0 8px; font-size: 13px; font-weight: 650; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hsub span, .chg h3 span { font-weight: 400; color: var(--muted); font-size: 12px; }
.hist-chart { padding: 10px 14px 4px; border-top: 1px solid var(--line); }
.hist-chart:first-child { border-top: 0; }
.hc-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.hc-top span { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chart { display: block; width: 100%; height: auto; margin-top: 4px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .ln { fill: none; stroke: var(--sel); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--bg); stroke: var(--sel); stroke-width: 2.2; }
.chart .val { fill: var(--ink); font-size: 12px; font-weight: 650; }
.chart .pg { cursor: pointer; }
.chg { margin-top: 12px; }
.chg:first-of-type { margin-top: 0; }
.chg h3 { margin: 0 0 6px; font-size: 13px; font-weight: 650; display: flex; gap: 8px; align-items: baseline; }
details.more { margin-top: 6px; }
details.more summary { cursor: pointer; font-size: 12px; color: var(--sel); }
details.more .box { margin-top: 6px; }
.pi.static { cursor: default; }
.plist .pi.static:hover { background: none; }
.chg .plist .pi span, .sec .plist .pi.static span { white-space: normal; text-align: right; min-width: 0; }
.chg .plist .pi b { flex: none; max-width: 45%; }

.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; font-size: 11px; font-weight: 650; white-space: nowrap; }
.tag.high, .lv-high { background: var(--high-bg); color: var(--high); }
.tag.mid, .lv-mid { background: var(--mid-bg); color: var(--mid); }
.tag.low, .lv-low { background: var(--low-bg); color: var(--low); }
.tag.refund { background: var(--refund-bg); color: var(--refund); }
.tag.info { background: var(--info-bg); color: var(--info); }
.tag.plain { background: var(--chip); color: var(--ink-2); }

/* ---------- reader ---------- */
.reader { background: var(--bg); }
.r-bar { display: flex; align-items: center; gap: 4px; padding: 10px 14px; min-height: 52px; border-bottom: 1px solid transparent; }
.r-bar .spacer { flex: 1; }
.r-bar .hint { font-size: 12px; color: var(--muted); margin-right: 6px; }
.article { max-width: 720px; margin: 0 auto; padding: 18px 40px 96px; }
.byline { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.byline .who b { display: block; font-size: 15px; font-weight: 700; }
.byline .who span { color: var(--ink-2); font-size: 14px; }
.byline .who button { color: inherit; text-align: left; }
.byline .who button:hover b { color: var(--sel); }
.avbig { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 20px; flex: none; }
.article h1 { font-size: 30px; line-height: 1.22; letter-spacing: -.02em; margin: 20px 0 6px; font-weight: 800; }
.dateline { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; margin: 0 0 14px; }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.tagrow .tag { height: 22px; padding: 0 8px; font-size: 12px; }
.lead { font-size: 17px; line-height: 1.7; margin: 0 0 22px; }
.lead b { font-weight: 650; }
.sec { margin: 0 0 28px; }
.sec > h2 { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
.sec > h2 span { font-weight: 500; letter-spacing: 0; }
.box { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cmp { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); border-top: 1px solid var(--line); }
.cmp:first-child { border-top: 0; }
.cmp > div:first-child { background: var(--chip); padding: 10px 12px; font-size: 13px; font-weight: 650; color: var(--ink-2); }
.cmp > div:last-child { padding: 10px 14px; font-size: 14px; line-height: 1.65; }
.cmp.bad > div:first-child { background: var(--high-bg); color: var(--high); }
.cmp small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.price { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.price:first-child { border-top: 0; }
.price small { color: var(--muted); margin-right: 6px; font-size: 12px; }
.price .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.price .n { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.orig { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 16px/1.85 var(--font); }
.links { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; }
.links li { margin: 3px 0; }
.voice { border-left: 3px solid var(--line-2); padding: 2px 0 2px 12px; margin: 0 0 14px; }
.voice.neg { border-left-color: var(--high); }
.voice .top { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.voice .top b { color: var(--ink); font-weight: 650; }
.voice q { display: block; quotes: "「" "」"; font-size: 15px; line-height: 1.7; margin: 3px 0; }
.voice .note { font-size: 12px; color: var(--muted); }
.caveat { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
details.fold { border: 1px solid var(--line); border-radius: 12px; }
details.fold + details.fold { margin-top: 8px; }
details.fold summary { list-style: none; cursor: pointer; padding: 11px 14px; font-weight: 650; display: flex; justify-content: space-between; align-items: center; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary::after { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); transition: transform .15s; margin-right: 3px; }
details.fold[open] summary::after { transform: rotate(-135deg); }
details.fold .in { padding: 0 14px 14px; color: var(--ink-2); line-height: 1.75; }
.narr { margin: 0; padding-left: 18px; }
.narr li { margin: 3px 0; }
.narr ul { padding-left: 18px; margin: 3px 0; }
.kv { margin: 0; }
.kv dt { font-size: 12px; color: var(--muted); margin-top: 8px; }
.kv dt:first-child { margin-top: 0; }
.kv dd { margin: 1px 0 0; overflow-wrap: anywhere; }
.plink { background: var(--sel-soft); color: var(--sel); font-weight: 650; font-size: .92em; padding: 0 6px; border-radius: 6px; line-height: 1.6; }

/* seller card + profile */
.scard { border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.scard p { margin: 4px 0 8px; color: var(--ink-2); font-size: 14px; line-height: 1.65; }
.scard .go { color: var(--sel); font-weight: 650; font-size: 13px; }
.ring { position: relative; width: 76px; height: 76px; flex: none; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring .v { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
.ring .v b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; display: block; }
.ring .v small { font-size: 10px; color: var(--muted); }
.ring.lg { width: 108px; height: 108px; }
.ring.lg .v b { font-size: 32px; }
.track { stroke: var(--line); }
.ring.high .arc { stroke: var(--high); }
.ring.mid .arc { stroke: var(--mid); }
.ring.low .arc { stroke: var(--low); }
.lvl { font-weight: 700; }
.lvl.high { color: var(--high); } .lvl.mid { color: var(--mid); } .lvl.low { color: var(--low); }
.prof-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; padding: 6px 0 20px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.prof-head h1 { margin: 10px 0 4px; }
.prof-head .meta { color: var(--muted); font-size: 13px; }
.rubric .r { display: grid; grid-template-columns: minmax(0, 1fr) 3.5em; gap: 4px 12px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: center; }
.rubric .r:first-child { border-top: 0; }
.rubric .r .t { font-weight: 600; }
.rubric .r .p { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }

/* brief */

.pr.corr .d button { padding: 0; border: 0; background: none; color: var(--sel); font: inherit; cursor: pointer; text-align: left; }
/* ---------- home: 买前速查 ---------- */
.home { display: none; }

.h-wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 56px; }

.h-hero p { margin: 0 0 22px; color: var(--ink-2); font-size: 15px; line-height: 1.65; max-width: 760px; }

.h-cats button { flex: none; padding: 8px 15px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; }

.h-cats button[aria-pressed="true"] small { color: inherit; opacity: .7; }
.h-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.h-sum { display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; margin: 0 0 12px; color: var(--ink-2); font-size: 14px; }

.h-tbl { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.h-hd, .h-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 82px 136px 64px 46px; gap: 10px; align-items: center; padding: 11px 14px; }
.h-hd { background: var(--side); color: var(--muted); font-size: 12px; font-weight: 650; }
.h-row { width: 100%; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
.h-row:hover { background: var(--hover); }
.h-n { color: var(--muted); font-variant-numeric: tabular-nums; }
.h-who { min-width: 0; }
.h-who b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-who small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

.wl { display: inline-block; font-size: 12px; font-weight: 650; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }

.wl.instant_refund { background: var(--info-bg); color: var(--info); }
.wl.first_login { background: var(--mid-bg); color: var(--mid); }

.wl.unstated { background: var(--chip); color: var(--ink-2); }

.h-risk { display: flex; flex-direction: column; gap: 1px; }

.h-risk span i { width: 8px; height: 8px; border-radius: 50%; background: #9a9aa0; }
.h-risk span.high { color: var(--high); } .h-risk span.high i { background: var(--high); }
.h-risk span.mid { color: var(--mid); } .h-risk span.mid i { background: var(--mid); }
.h-risk span.low { color: var(--ink-2); }
.h-risk small { color: var(--muted); font-size: 11px; }
.h-day { color: var(--muted); font-size: 13px; text-align: right; }
.h-more { width: 100%; padding: 12px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--sel); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.h-note { margin: 10px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.7; }
.h-note button { padding: 0; border: 0; background: none; color: var(--sel); font: inherit; cursor: pointer; }
.h-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
.h-card h3 { display: flex; justify-content: space-between; gap: 8px; margin: 0 0 10px; color: var(--muted); font-size: 13px; font-weight: 650; }
.h-card h3 button { padding: 0; border: 0; background: none; color: var(--sel); font: inherit; font-weight: 600; cursor: pointer; }
.h-hl { display: block; width: 100%; padding: 9px 0; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.h-hl:first-of-type { border-top: 0; padding-top: 0; }
.h-hl b { display: block; font-size: 14px; line-height: 1.5; }
.h-hl span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; color: var(--ink-2); font-size: 12.5px; line-height: 1.6; }
.h-lg { display: grid; gap: 8px; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.h-lg div { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 8px; align-items: start; }
.h-card p { margin: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.7; }
.h-static { margin-top: 28px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.h-static a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.h-static a:hover { color: var(--ink); }
.h-static .h-sep { width: 1px; height: 12px; background: var(--line); }
.h-foot { margin-top: 14px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; line-height: 1.7; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between; }
@media (max-width: 760px) {
  .h-bar { padding: 0 14px; height: 52px; }
  .h-wrap { padding: 0 14px 40px; }
  .h-nav { display: none; }
  .h-social a { height: 30px; padding: 0 9px; font-size: 12px; }
  .h-social a .full { display: none; }
  .h-tabs2 { display: flex; gap: 2px; padding: 0 14px 8px; overflow-x: auto; }
  .h-tabs2 button { flex: none; padding: 5px 10px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); font: inherit; font-size: 14px; }

  .h-hero h1 { font-size: 23px; margin-top: 18px; }
  .h-hero p { font-size: 14px; margin-bottom: 16px; }
  .h-grid { grid-template-columns: minmax(0, 1fr); }
  .h-hd { display: none; }
  .h-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "who price" "wl risk"; row-gap: 7px; padding: 12px; }
  .h-n, .h-day { display: none; }
  .h-who { grid-area: who; } .h-price { grid-area: price; } .h-wl { grid-area: wl; }
  .h-risk { grid-area: risk; flex-direction: row; align-items: center; gap: 6px; justify-self: end; }
  .h-wl small { display: inline; margin: 0 0 0 6px; }
}
/* ---------- step C: brief post list, post verdict ---------- */
.bp { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.bp:first-child { border-top: 0; }
.bp:hover { background: var(--hover); }

.bp-main b { display: block; font-size: 14px; }

.bp-side { display: flex; gap: 6px; align-items: center; }
.bp-risk { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--ink-2); min-width: 26px; }
.bp-risk i { width: 7px; height: 7px; border-radius: 50%; background: #9a9aa0; }
.bp-risk.high { color: var(--high); } .bp-risk.high i { background: var(--high); }
.bp-risk.mid { color: var(--mid); } .bp-risk.mid i { background: var(--mid); }
.verdict { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; margin: 14px 0 12px; overflow: hidden; }
.verdict > div { padding: 12px 14px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.verdict > div:first-child { border-left: 0; }
.verdict span:first-child { color: var(--muted); font-size: 12px; font-weight: 650; }
.verdict b { font-size: 20px; line-height: 1.3; }
.verdict b .wl { font-size: 13px; }
.verdict small { color: var(--ink-2); font-size: 12px; line-height: 1.5; }
.vlink { padding: 0; border: 0; background: none; font: inherit; cursor: pointer; }
.vlink .lvl { font-size: 14px; }
.issue { margin: 0 0 12px; padding: 11px 14px; border-radius: 10px; background: var(--mid-bg); font-size: 14px; line-height: 1.65; }
.issue.bad { background: var(--high-bg); }
.issue b { margin-right: 8px; }
.sec > details.fold:first-of-type { margin-top: 0; }
@media (max-width: 720px) {
  .verdict { grid-template-columns: minmax(0, 1fr); }
  .verdict > div { border-left: 0; border-top: 1px solid var(--line); }
  .verdict > div:first-child { border-top: 0; }
  .bp { grid-template-columns: 22px minmax(0, 1fr); }
  .bp-side { grid-column: 2; }
}
/* Reading-app extras (unread dots, stars, mark-all-read, shortcut hints) are hidden in the new layout. */
.item .dot, .item .star, #markAll, #readBtn, #starBtn, .hint { display: none !important; }
.foot-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

.flink:hover { background: var(--hover); }
.disclaim { font-size: 12px; color: var(--muted); line-height: 1.7; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 8px; }

/* ---------- responsive ---------- */
.scrim { display: none; }
@media (max-width: 1100px) {
  .app { grid-template-columns: 320px minmax(0, 1fr); }

@media (min-width: 1101px) { .menu-btn { display: none; } }
@media (max-width: 720px) {

  .item { padding-right: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c])); }

    const d = days.find((x) => x.date === day);

function chartSvg(sr) {
  const W = 600, H = 150, L = 40, R = 40, T = 24, B = 26;
  const span = DAYS_ASC.filter((d) => d >= sr.pts[0].day && d <= sr.pts[sr.pts.length - 1].day);
  const xs = (d) => span.length < 2 ? (L + W - R) / 2 : L + (W - L - R) * span.indexOf(d) / (span.length - 1);
  const vals = sr.pts.map((p) => p.amount);
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi === lo) { lo = lo * 0.9; hi = hi * 1.1 || 1; } else { const pad = (hi - lo) * 0.15; lo -= pad; hi += pad; }
  const ys = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const step = Math.max(1, Math.ceil(span.length / 7));
  let g = "";
  [lo + (hi - lo) * 0.25, lo + (hi - lo) * 0.75].forEach((v) => { g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + ys(v).toFixed(1) + '" y2="' + ys(v).toFixed(1) + '"/>'; });  // points carry their own price labels
  span.forEach((d, i) => { if (i % step === 0 || i === span.length - 1) g += '<text x="' + xs(d).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + d.slice(5) + "</text>"; });
  const line = sr.pts.map((p) => xs(p.day).toFixed(1) + "," + ys(p.amount).toFixed(1)).join(" ");
  const dots = sr.pts.map((p) => '<g class="pg" data-go="' + esc(p.id) + '"><title>' + esc(p.day + " " + fmtPrice({ amount: p.amount, cur: sr.cur }) + (p.from ? " 起" : "") + "，点开原帖") + '</title><circle class="pt" cx="' + xs(p.day).toFixed(1) + '" cy="' + ys(p.amount).toFixed(1) + '" r="4.5"/><text class="val" x="' + xs(p.day).toFixed(1) + '" y="' + (ys(p.amount) - 9).toFixed(1) + '" text-anchor="middle">' + fmtPrice({ amount: p.amount, cur: sr.cur }) + "</text></g>").join("");
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(CATLABEL(sr.cat) + "价格走势：" + sr.pts.map((p) => p.day + " " + fmtPrice({ amount: p.amount, cur: sr.cur })).join("，")) + '">' + g + '<polyline class="ln" points="' + line + '"/>' + dots + "</svg>";
}

/* ================= interaction ================= */
const mobile = window.matchMedia("(max-width: 720px)");
function select(id, opts) {
  opts = opts || {};
  state.sel = id;
  const it = byId.get(id);
  if (it && opts.markRead !== false) setRead(id, true);
  renderSide(); renderList(); renderReader();
  syncHash();
  const row = document.querySelector('.item[data-id="' + CSS.escape(id) + '"]');
  if (row && opts.focus !== false) { row.scrollIntoView({ block: "nearest" }); if (!mobile.matches) row.focus({ preventScroll: true }); }
  if (mobile.matches && opts.open !== false) document.body.classList.add("reading");
}
function setView(v) {
  state.view = v;
  closeSide();
  const list = viewItems();
  if (v.startsWith("seller:")) select("seller:" + v.slice(7), { open: false, focus: false });
  else select(list[0] ? list[0].id : null, { open: false, focus: false, markRead: !mobile.matches });
}
function syncHash() {
  const h = "#v=" + encodeURIComponent(state.view) + (state.view === "rank:price" ? "&c=" + state.pcat : "") + (state.sel ? "&i=" + encodeURIComponent(state.sel) : "");
  if (location.hash !== h) history.replaceState(null, "", h);
}
function closeSide() { document.body.classList.remove("side-open"); }

document.getElementById("side-scroll").addEventListener("click", (e) => { const b = e.target.closest("[data-view]"); if (b) setView(b.dataset.view); });
document.getElementById("list").addEventListener("click", (e) => { const b = e.target.closest("[data-id]"); if (b) select(b.dataset.id); });
document.addEventListener("click", (e) => {
  const r = e.target.closest("[data-rank]");
  if (r) { state.pcat = r.dataset.rank; state.view = "rank:price"; const sel = r.dataset.sel || (state.sel && state.sel.startsWith("seller:") && PRICES[state.pcat].some((x) => x.id === state.sel) ? state.sel : null); if (sel) select(sel, { focus: false }); else setView("rank:price"); return; }
  const gv = e.target.closest("[data-goview]");
  if (gv) { setView(gv.dataset.goview); return; }
  const pc = e.target.closest("[data-pcat]");
  if (pc) { state.pcat = pc.dataset.pcat; setView("rank:price"); return; }
  const g = e.target.closest("[data-go]");
  if (!g) return;
  const id = g.dataset.go;
  if (id.startsWith("seller:")) { if (sellers.has(id.slice(7))) { state.view = id; select(id, { focus: false }); } return; }
  if (PAGES[id]) { closeSide(); select(id, { focus: false }); return; }
  if (!byId.has(id)) return;
  else { if (!viewItems().some((x) => x.id === id)) state.view = "day:" + byId.get(id).day; select(id); }
});
document.getElementById("q").addEventListener("input", (e) => {
  state.q = e.target.value; renderList();
  if (state.q.trim() && loaded.size < FEED.days.length) ensureAll().then(() => { if (state.q.trim()) renderList(); });  // search needs full text
});
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.toggle("side-open"));
document.getElementById("scrim").addEventListener("click", closeSide);
document.getElementById("backBtn").addEventListener("click", () => document.body.classList.remove("reading"));
document.getElementById("readBtn").addEventListener("click", () => { if (!state.sel) return; setRead(state.sel, !isRead(state.sel)); renderSide(); renderList(); renderReader(); });
document.getElementById("starBtn").addEventListener("click", () => { if (!state.sel) return; setStar(state.sel, !isStar(state.sel)); renderSide(); renderList(); renderReader(); });
document.getElementById("sellerBtn").addEventListener("click", (e) => { const k = e.currentTarget.dataset.key; if (k) { state.view = "seller:" + k; select("seller:" + k, { focus: false }); } });
document.getElementById("markAll").addEventListener("click", () => { current.forEach((it) => READ.add(it.id)); store.set("read", READ); renderSide(); renderList(); renderReader(); });
document.addEventListener("keydown", (e) => {
  if (/input|textarea/i.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const i = current.findIndex((x) => x.id === state.sel);
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); const n = current[i + 1] || (i < 0 && current[0]); if (n) select(n.id, { open: false }); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); const n = current[i - 1]; if (n) select(n.id, { open: false }); }
  else if ((e.key === "u" || e.key === "U") && byId.has(state.sel)) { setRead(state.sel, !isRead(state.sel)); renderSide(); renderList(); renderReader(); }
  else if ((e.key === "s" || e.key === "S") && byId.has(state.sel)) { setStar(state.sel, !isStar(state.sel)); renderSide(); renderList(); renderReader(); }
  else if (e.key === "/") { e.preventDefault(); document.getElementById("q").focus(); }
  else if (e.key === "Escape") { closeSide(); document.body.classList.remove("reading"); }
});

homeEl.addEventListener("click", (e) => {

  if (e.target.closest("[data-hmore]")) { home.all = true; renderHome(); return; }
  const r = e.target.closest("[data-hseller]");
  if (r) { const k = r.dataset.hseller; toApp(() => { state.view = "seller:" + k; select("seller:" + k, { focus: false }); }); return; }
  const n = e.target.closest("[data-hnav]");
  if (!n) return;

  if (k === "home") { window.scrollTo(0, 0); return; }
  if (k === "classic") { try { localStorage.setItem("csd:layout", "classic"); } catch (e) {} location.href = "classic.html"; return; }
  if (k === "daily") toApp(() => { state.view = "latest"; select("d:" + LAST_DAY, { focus: false }); });
  else if (k === "sellers") toApp(() => setView("rank:score"));
  else if (k === "rank") toApp(() => { state.pcat = home.cat; setView("rank:price"); });
  else if (k === "corrections") toApp(() => select("page:corrections", { focus: false }));
});

function routeApp() {
  const h = new URLSearchParams(location.hash.slice(1));
